<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">
    <div class="auth-card">
        <h2 id="auth-title">Login to TaskFlow</h2>

        <div id="auth-message" class="message"></div>

        <!-- Login Form -->
        <form id="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn primary-btn">Login</button>
            <p class="toggle-text">Don't have an account? <a href="#" id="show-register">Sign Up</a></p>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="hidden">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg-name" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn primary-btn">Sign Up</button>
            <p class="toggle-text">Already have an account? <a href="#" id="show-login">Login</a></p>
        </form>
    </div>

    <script src="app.js"></script>
</body>

</html>
